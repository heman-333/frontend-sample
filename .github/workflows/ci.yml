name: Frontend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # =========================
  # CI
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .output/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/heman-333/frontend-sample:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/heman-333/frontend-sample:latest


  # =========================
  # CD
  # =========================
  deploy:
    needs: build
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Pull latest Docker image
        run: |
          docker pull ghcr.io/heman-333/frontend-sample:latest

      - name: Stop old container
        run: |
          docker stop frontend || true

      - name: Remove old container
        run: |
          docker rm frontend || true

      - name: Start new container
        run: |
          docker run -d \
            --name frontend \
            -p 3000:3000 \
            ghcr.io/heman-333/frontend-sample:latest
